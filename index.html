<style>
:root{
  --bg:#140a0e; --bg2:#1f1016; --card:#2a141c; --line:#3d2029;
  --wine:#7a1f35; --wine2:#a32b48; --gold:#d4b07a; --gold2:#f0d7a8;
  --txt:#f4e9e4; --mut:#b39a9f; --ok:#6fae8c; --no:#7d5a63;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0b0507;color:var(--txt);font-family:Inter,system-ui,sans-serif}
body{display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100%;background:radial-gradient(120% 60% at 50% 0%,#3a1422 0%,var(--bg) 60%);position:relative;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
h1,h2,h3,.serif{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.3px}
h1{font-size:34px} h2{font-size:28px;margin-bottom:6px} h3{font-size:21px}
.mut{color:var(--mut);font-size:14px;line-height:1.5}
main{flex:1;padding:22px 20px 110px;overflow-y:auto}
.card{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:999px;padding:14px 22px;font:600 15px Inter;cursor:pointer;color:#1a0b10;background:linear-gradient(135deg,var(--gold2),var(--gold));width:100%}
.btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--gold)}
.btn:active{transform:scale(.98)}
.row{display:flex;gap:10px}
.tag{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;background:#3a1a24;color:var(--gold2);margin-right:6px}
nav{position:fixed;bottom:0;width:100%;max-width:430px;display:flex;justify-content:space-around;background:rgba(20,10,14,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 4px calc(12px + env(safe-area-inset-bottom))}
nav button{background:none;border:none;color:var(--mut);font:500 11px Inter;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;flex:1}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--gold)}
.hero{text-align:center;padding:18px 0 4px}
.flame{width:84px;height:84px;margin:0 auto 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;cursor:pointer;text-align:left;color:var(--txt);font-family:Inter}
.tile svg{width:28px;height:28px;display:block}
.tile b{display:block;font-family:"Cormorant Garamond";font-size:20px;margin:8px 0 2px}
.tile span{font-size:12px;color:var(--mut)}
.note{font-size:12.5px;color:var(--mut);border-left:2px solid var(--gold);padding:8px 12px;margin-top:18px;line-height:1.5;background:#1d0d13;border-radius:0 12px 12px 0}
/* match */
.qcard{min-height:250px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 22px}
.qcard .serif{font-size:27px;line-height:1.25}
.choices{display:flex;gap:10px;margin-top:18px}
.choices button{flex:1;padding:14px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--txt);font:600 14px Inter;cursor:pointer}
.choices .y{border-color:var(--wine2);background:linear-gradient(160deg,#5a1828,#3a1220)}
.choices .m{border-color:#6b5532}
.progress{height:5px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--wine2),var(--gold));transition:width .3s}
input.name{width:100%;margin-top:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#1a0c11;color:var(--txt);font:15px Inter}
.res{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.res:last-child{border:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
/* défis */
.day{display:flex;gap:14px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.day:last-child{border:none}
.chk{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#1a0b10;margin-top:2px}
.day.done .chk{background:var(--gold)}
.day.done .t{opacity:.55}
.day small{color:var(--gold);font-size:11px;letter-spacing:1px;text-transform:uppercase}
.phase{font-family:"Cormorant Garamond";font-size:19px;color:var(--gold2);margin-top:22px}
/* positions */
.filters{display:flex;gap:8px;overflow-x:auto;margin-top:14px;padding-bottom:4px}
.filters button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:999px;padding:8px 14px;font:500 13px Inter;cursor:pointer}
.filters button.on{color:#1a0b10;background:var(--gold);border-color:var(--gold)}
.pos{display:flex;gap:14px;align-items:center;cursor:pointer}
.medal{width:62px;height:62px;flex:none;border-radius:50%;background:radial-gradient(circle at 30% 30%,#5a1828,#260d15);border:1px solid #6b3a45;display:flex;align-items:center;justify-content:center}
.medal svg{width:34px;height:34px}
.lvl{color:var(--gold);font-size:12px;letter-spacing:2px}
.modal{position:fixed;inset:0;background:rgba(8,3,5,.82);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:f .2s}
.sheet{width:100%;max-width:430px;background:var(--bg2);border-radius:26px 26px 0 0;border-top:1px solid var(--line);padding:26px 22px calc(28px + env(safe-area-inset-bottom));animation:u .25s}
@keyframes f{from{opacity:0}} @keyframes u{from{transform:translateY(40px)}}
.thumb{width:104px;height:66px;flex:none;border-radius:14px;background:#1a0c11;border:1px solid var(--line);padding:4px}
.thumb svg,.big svg{width:100%;height:100%;display:block}
.big{background:#1a0c11;border:1px solid var(--line);border-radius:18px;padding:10px;aspect-ratio:200/120}
.legend{display:flex;justify-content:center;gap:16px;margin-top:10px;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.steps{margin:10px 0 0 0;padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 38px;font-size:14.5px;line-height:1.5;border-bottom:1px solid var(--line)}
.steps li:last-child{border:none}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:26px;height:26px;border-radius:50%;background:var(--wine);color:var(--gold2);font:600 13px Inter;display:flex;align-items:center;justify-content:center}
.sheet{max-height:90vh;overflow-y:auto}
.player{display:flex;justify-content:center;gap:10px;margin-top:16px}
.player button{border:1px solid var(--line);background:var(--card);color:var(--gold2);border-radius:999px;height:40px;min-width:44px;padding:0 14px;font:600 15px Inter;cursor:pointer}
.player .play{min-width:120px}
.steps.anim li{cursor:pointer;opacity:.5;transition:opacity .3s}
.steps.anim li.on{opacity:1}
.steps.anim li.on::before{background:var(--gold);color:#1a0b10}
.big3d{position:relative;height:250px;border-radius:18px;background:radial-gradient(90% 80% at 50% 40%,#2c121b,#140a0e);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab}
.big3d canvas{display:block;width:100%!important;height:100%!important}
.views{position:absolute;top:10px;left:10px;display:flex;gap:6px}
.views button{border:1px solid var(--line);background:rgba(20,10,14,.75);color:var(--mut);border-radius:999px;padding:5px 11px;font:500 12px Inter;cursor:pointer}
.views button.on{color:#1a0b10;background:var(--gold);border-color:var(--gold)}
.hint{position:absolute;bottom:8px;right:12px;font-size:11px;color:var(--mut);pointer-events:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
.rtabs{display:flex;gap:8px;margin-top:16px}
.rtabs button{flex:1;padding:11px 6px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 13px Inter;cursor:pointer}
.rtabs button.on{color:#1a0b10;background:var(--gold);border-color:var(--gold)}
.ritem{padding:14px 0;border-bottom:1px solid var(--line)}
.ritem:last-child{border:none;padding-bottom:2px}
.ritem b{font-size:15px}
.ritem .num{font:600 20px Inter;color:var(--gold2);margin:6px 0 4px;letter-spacing:.5px}
.ritem p{margin-top:4px}
.ritem a{display:inline-block;margin-top:8px;color:var(--gold);font:600 13.5px Inter;text-decoration:none;border-bottom:1px solid rgba(212,176,122,.4)}
nav button{font-size:10.5px}
.inlink{display:inline-block;margin-top:4px;color:var(--gold);font-weight:600;cursor:pointer;border-bottom:1px solid rgba(212,176,122,.45);text-decoration:none}
.phase{scroll-margin-top:16px;transition:color .3s,text-shadow .3s}
.phase.flash{color:#fff;text-shadow:0 0 12px var(--gold)}
.forgot{margin-top:22px;background:none;border:none;color:var(--mut);font:500 13px Inter;text-decoration:underline;cursor:pointer}
.pins.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* cartes */
.lvls{display:flex;gap:8px;margin-top:16px}
.lvls button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:600 14px Inter;cursor:pointer}
.lvls button span{font-size:22px}
.lvls button.on{color:#fff;border-color:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 45%,#2a141c),#2a141c);box-shadow:0 0 0 1px var(--c) inset}
.ctype{display:inline-block;padding:5px 12px;border-radius:999px;color:#fff;font:600 12px Inter;margin-bottom:16px}

.deck{perspective:900px;margin-top:20px}
.flip{height:340px;border-radius:24px;position:relative;transform-style:preserve-3d;transition:transform .6s;cursor:pointer}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.front{background:linear-gradient(150deg,var(--wine),#3a0f1d);border:1px solid var(--wine2)}
.back{background:linear-gradient(160deg,#2e161e,#1b0c11);border:1px solid var(--gold);transform:rotateY(180deg)}
.back .serif{font-size:26px;line-height:1.3}
.cat{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
/* lock */
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(100% 60% at 50% 20%,#3a1422,var(--bg));display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.pins{display:flex;gap:16px;margin:26px 0}
.pins i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--gold)}
.pins i.f{background:var(--gold)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;border:1px solid var(--line);background:rgba(42,20,28,.6);color:var(--txt);font:500 24px Inter;cursor:pointer}
.pad button:active{background:var(--wine)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--gold);color:#1a0b10;padding:10px 18px;border-radius:999px;font:600 13px Inter;z-index:60}
</style>
</head>

function shade(c){return c==="#d4b07a"?"#8f7148":"#7d2c44"}
function figure(f,col,num){
  const pt=a=>a.join(",");
  const line=(pts,w,c)=>`<polyline points="${pts.map(pt).join(" ")}" stroke="${c}" stroke-width="${w}"/>`;
  const out="#140a0e", dk=shade(col);
  const far=[[[f.p,f.k2||f.k1,f.f2||f.f1],9],[[f.n,f.e2||f.e1,f.w2||f.w1],7]];
  const near=[[[f.p,f.k1,f.f1],9],[[f.n,f.e1,f.w1],7]];
  let g="";
  far.forEach(([p,w])=>g+=line(p,w+4,out)+line(p,w,dk));
  g+=line([f.n,f.p],19,out)+line([f.n,f.p],15,col);
  g+=`<circle cx="${f.h[0]}" cy="${f.h[1]}" r="12" fill="${out}"/><circle cx="${f.h[0]}" cy="${f.h[1]}" r="10" fill="${col}"/>`;
  near.forEach(([p,w])=>g+=line(p,w+4,out)+line(p,w,col));
  [f.w1,f.f1].forEach(q=>g+=`<circle cx="${q[0]}" cy="${q[1]}" r="4.6" fill="${col}"/>`);
  g+=`<text x="${f.h[0]}" y="${f.h[1]+4}" text-anchor="middle" font-family="Inter,sans-serif" font-weight="700" font-size="11" fill="#1a0b10" stroke="none">${num}</text>`;
  return `<g fill="none" stroke-linecap="round" stroke-linejoin="round">${g}</g>`;
}

  let w=x1-x0,h=y1-y0;const R=200/120;
  if(w/h<R){const nw=h*R;x0-=(nw-w)/2;w=nw}else{const nh=w/R;y0-=(nh-h)/2;h=nh}
  return `<svg viewBox="${x0} ${y0} ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${SCENE[p.sc]}${p.pillow?'<ellipse cx="92" cy="90" rx="17" ry="6" fill="#6b3a45"/>':""}${figure(p.A,"#d4b07a","1")}${figure(p.B,"#c2496a","2")}${p.heart?'<path d="M90 50c-4-5-11-1-8 4l8 7 8-7c3-5-4-9-8-4z" fill="#c2496a"/>':""}</svg>`;
}

    RES.conseils.map(([t,d])=>`<div class="card"><h3 style="color:var(--gold2)">${t}</h3><p class="mut" style="margin-top:6px;color:var(--txt)">${d}</p></div>`).join("")+sec("📖","Pour lire",RES.art)
  :(S.rtab==="shop")?
    `<div class="note">Sélection indicative, non sponsorisée. Les liens s'ouvrent dans votre navigateur.</div>`+sec("💧","Lubrifiants bio",RES.lub)+sec("💞","Jouets pour couple",RES.toys)
  :
    sec("📞","Numéros d'écoute",RES.aide)+sec("🩺","Consulter un·e sexologue",RES.pro)
  }`;
}

function render(){
  renderNav();
  $v.innerHTML={home:vHome,match:vMatch,defis:vDefis,pos:vPos,cartes:vCartes,res:vRes}[S.tab]();
}

/* ---------- VERROU ---------- */
(function(){
  const KEY="etc_pin";
  const get=()=>{try{return localStorage.getItem(KEY)}catch(e){return null}};
  const set=v=>{try{v===null?localStorage.removeItem(KEY):localStorage.setItem(KEY,v)}catch(e){}};
  async function hash(p){
    try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("etincelle:"+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
    catch(e){return "p:"+p}
  }
  const lock=document.getElementById("lock"),msg=document.getElementById("lockmsg"),pins=document.getElementById("pins"),pad=document.getElementById("pad"),forgot=document.getElementById("forgot");
  let pin="",mode=get()?"check":"create",first="",busy=false;
  const say=(t,err)=>{msg.textContent=t;msg.style.color=err?"#e8768f":""};
  const dots=()=>pins.querySelectorAll("i").forEach((d,i)=>d.classList.toggle("f",i<pin.length));
  const shake=()=>{pins.classList.remove("shake");void pins.offsetWidth;pins.classList.add("shake")};
  const intro=()=>{
    if(mode==="create"){say("Choisissez un code à 4 chiffres pour protéger l'appli");forgot.style.display="none"}
    else if(mode==="confirm"){say("Confirmez votre code")}
    else{say("Entrez votre code");forgot.style.display=""}
  };
  const unlock=()=>{lock.style.transition="opacity .4s";lock.style.opacity=0;setTimeout(()=>lock.remove(),400)};
  async function done(){
    busy=true;const p=pin;
    await new Promise(r=>setTimeout(r,180));
    pin="";dots();
    if(mode==="create"){first=p;mode="confirm";intro()}
    else if(mode==="confirm"){
      if(p===first){set(await hash(p));say("Code enregistré ✓");setTimeout(unlock,500)}
      else{shake();mode="create";first="";say("Les codes ne correspondent pas, recommencez",true)}
    }else{
      if(await hash(p)===get())unlock();
      else{shake();say("Code incorrect",true)}
    }
    busy=false;
  }
  pad.innerHTML=[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<span></span>":`<button data-k="${k}" aria-label="${k==="⌫"?"Effacer":k}">${k}</button>`).join("");
  pad.onclick=e=>{
    const k=e.target.dataset&&e.target.dataset.k;if(k===undefined||busy)return;
    pin=k==="⌫"?pin.slice(0,-1):(pin+k).slice(0,4);dots();
    if(pin.length===4)done();
  };
  forgot.onclick=()=>{
    const box=document.createElement("div");box.className="modal";box.style.zIndex=70;box.style.alignItems="center";
    box.innerHTML=`<div class="sheet" style="border-radius:24px;margin:20px;max-width:380px"><h3>Réinitialiser le code ?</h3><p class="mut" style="margin:10px 0 18px">Votre progression dans les défis sera effacée, puis vous pourrez choisir un nouveau code.</p><div class="row"><button class="btn ghost" data-n>Annuler</button><button class="btn" data-y>Réinitialiser</button></div></div>`;
    box.onclick=ev=>{
      if(ev.target.dataset.y!==undefined){set(null);try{localStorage.removeItem("etc_done")}catch(e){};S.done=[];render();mode="create";pin="";dots();intro();box.remove()}
      else if(ev.target===box||ev.target.dataset.n!==undefined)box.remove();
    };
    document.body.appendChild(box);
  };
  intro();
})();
render();
window.addEventListener("load",()=>setTimeout(makeThumbs,50));
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).catch(()=>{}))}
</script>
